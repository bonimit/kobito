# Builds the web version of Kobito and publishes it on GitHub Pages, so
# anyone can play it from a link: https://<owner>.github.io/<repo>/
#
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions"
# (GitHub Pages needs a public repository, or a paid plan for a private
# one). After that every push to the default branch rebuilds and
# republishes. Until Pages is on, the deploy step just reports it.
# Each run also keeps the built site as a downloadable "kobito-web"
# artifact (ready to upload to itch.io as an HTML5 game by hand).
#
# itch.io, automatically: add a repository secret BUTLER_API_KEY (your
# itch.io API key) and a repository variable ITCH_GAME (e.g. bonimit/kobito)
# under Settings -> Secrets and variables -> Actions; every run then
# uploads the new build to that itch.io page with butler.
name: Web build

on:
  push:
    branches: [main, claude/japanese-platformer-pygame-w1vgyw]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pygbag
        run: pip install pygbag==0.9.3
      - name: Build the web version
        run: bash packaging/build_web.sh
      - name: Keep the site as a download (for itch.io)
        uses: actions/upload-artifact@v4
        with:
          name: kobito-web
          path: build/web
      - name: Prepare the site for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Without Pages turned on this step can't publish; don't fail the whole
    # run over it -- the build and its kobito-web download still work.
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish on GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  itch:
    needs: build
    # Only once the itch.io page is set up (see the top of this file).
    if: ${{ vars.ITCH_GAME != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kobito-web
          path: web
      - name: Get butler (itch.io's upload tool)
        run: |
          curl -sSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler-bin
          chmod +x butler-bin/butler
          butler-bin/butler -V
      - name: Upload to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: butler-bin/butler push web "${{ vars.ITCH_GAME }}:html5" --userversion "build-${{ github.run_number }}"
